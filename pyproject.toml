[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-coding-agent"
version = "0.1.0"
description = "A small terminal coding agent for learning modern agent building blocks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent Tutorial" }]
dependencies = []

[project.scripts]
simple-agent = "simple_coding_agent.cli:main"

[tool.setuptools.packages.find]
include = ["simple_coding_agent*"]
